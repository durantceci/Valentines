<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try Again!</title>
    <style>
        body {
            text-align: center;
            background: url('https://example.com/lightning_mcqueen_background.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Bangers', cursive;
            color: white;
            text-shadow: 2px 2px 4px black;
            margin-top: 50px;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
        }

        h2 {
            font-size: 36px;
        }

        p {
            font-size: 24px;
            margin-top: 10px;
        }

        .emoji {
            font-size: 100px;
        }

        .mater {
            width: 200px;
            margin-top: 20px;
        }

</head>
<body>
    <div class="container">
        <h2>Try again, sugar! 😆</h2>
        <p class="emoji">😞</p>
        <p>Looks like you got towed off track... Tow Mater says "McQueen never loses, y'all!" 🏁</p>
        <img class="mater" src="https://upload.wikimedia.org/wikipedia/en/thumb/a/ab/Tow_Mater.png/250px-Tow_Mater.png" alt="Tow Mater">
        <p>Love, Ceci 💕</p>
    </div>

</html>
