<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ka-Chow! Be My Valentine?</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');

        body {
            text-align: center;
            background: url('https://wallpaperaccess.com/full/2555575.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Bangers', cursive;
            color: white;
            text-shadow: 2px 2px 4px black;
            margin-top: 50px;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
        }

        h2 {
            font-size: 36px;
        }

        p {
            font-size: 24px;
            margin-top: 10px;
        }

        button {
            background-color: #ff0000;
            color: yellow;
            border: none;
            padding: 15px 25px;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 10px;
            font-family: 'Bangers', cursive;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ffcc00;
            color: #ff0000;
        }

        .mcqueen {
            width: 200px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>You make my heart go Ka-Chow! 💖🏁</h2>
        <p>Will you be my Valentine?</p>
        <button onclick="alert('Ka-Chow! Best decision ever! ❤️🏁')">Yes!</button>
        <button onclick="alert('What?! Lightning McQueen never loses! Try again! 😆')">No</button>
        <br>
        <img class="mcqueen" src="https://upload.wikimedia.org/wikipedia/en/thumb/8/88/Lightning_McQueen.png/250px-Lightning_McQueen.png" alt="Lightning McQueen">
        <p>Love, Ceci 💕</p>
    </div>
</body>
</html>
